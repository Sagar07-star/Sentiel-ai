services:
  sentinel-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-ai
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - sentinel_runtime:/app/runtime

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  postgres:
    image: postgres:17-alpine
    container_name: sentinel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel

    volumes:
      - sentinel_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sentinel -d sentinel"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:
  sentinel_runtime:
  sentinel_postgres: